<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>File this form</legend>
            <label for="name">Name</label>
            <input type="text"  id="name" placeholder="Enter your name" required><br><br>

            <label for="login">Password:</label>
            <input type="password" id="login" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="example@gmail.com" required><br><br>

            <input type="file"><br><br>

            <label for="dob">DOB:</label>
            <input type="date" id="dob"><br><br>

            <input type="reset">
            <input type="submit"><br><br>

            <label for="complaint">Complaint:</label>
            <textarea name="" id="complaint"></textarea><br><br><br><br>

            <label for="okay">Okay</label>
            <input type="radio" name="experience">

            <label for="bad">Bad</label>
            <input type="radio" name="experience">

            <label for="mid">Mid</label>
            <input type="radio" name="experience">

        </fieldset>

    </form>
</body>
</html>
